name: Docs site

# Publishes docs/ to GitHub Pages with MkDocs Material.
# Enable it once: Settings > Pages > Build and deployment > Source: GitHub Actions
# (Pages needs a public repository, or a paid plan for private ones).
# Then add the push trigger below back:
#   push:
#     branches: [main]
#     paths: ['docs/**', 'mkdocs.yml', 'README.md']

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
