name: Release

# Push a tag like v1.2.0 to publish a GitHub Release with:
#   - PPLF_managed.zip     (import into test/production)
#   - PPLF_unmanaged.zip   (import into a dev environment)
#   - pplf-deployer.browser.js                      (no-install deployer)
#   - Pplf.Plugins.dll                              (optional pro-code logging)

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify generated files and run tests
        run: |
          npm run check
          npm test

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build plug-ins
        run: dotnet build src/plugins/Pplf.Plugins/Pplf.Plugins.csproj -c Release -o out/plugins

      - uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack unmanaged solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: src/solution
          solution-file: out/PPLF_unmanaged.zip
          solution-type: Unmanaged

      - name: Pack managed solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: src/solution
          solution-file: out/PPLF_managed.zip
          solution-type: Managed

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/PPLF_managed.zip
            out/PPLF_unmanaged.zip
            out/plugins/Pplf.Plugins.dll
            dist/pplf-deployer.browser.js
