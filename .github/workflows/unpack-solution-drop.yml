name: Unpack solution drop

# For exports made by hand (no service principal needed):
#   1. Export the PPLF solution from dev twice: unmanaged and managed.
#   2. Commit both zips to .drop/ as PPLF.zip and PPLF_managed.zip and push.
# This workflow unpacks them into src/solution (canvas app sources included),
# removes environment variable *values* so no tenant-specific settings are
# published, deletes .drop/ and opens a pull request (main is protected).

on:
  push:
    branches: [main]
    paths: ['.drop/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  unpack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the drop
        shell: pwsh
        run: |
          foreach ($f in '.drop/PPLF.zip', '.drop/PPLF_managed.zip') {
            if (-not (Test-Path $f)) { throw "Missing $f" }
          }

      - uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Unpack (unmanaged + managed)
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: .drop/PPLF.zip
          solution-folder: src/solution
          solution-type: Both
          process-canvas-apps: true
          overwrite-files: true

      - name: Remove environment variable values
        shell: pwsh
        run: |
          Get-ChildItem src/solution -Recurse -Filter environmentvariablevalues.json | ForEach-Object {
            Write-Host "Removing $($_.FullName)"
            Remove-Item $_.FullName
          }
          # flows snapshot environment variable values into their parameter defaults; blank them
          Get-ChildItem src/solution/Workflows -Filter *.json | ForEach-Object {
            $t = Get-Content $_.FullName -Raw
            $n = [regex]::Replace($t, '("PPLF \| [^"]+ \(pplf_(AlertRecipients|SharePointSite|SharePointLogList|SharePointConfigList)\)":\s*\{\s*"defaultValue":\s*)"[^"]*"', '$1""')
            if ($n -ne $t) { Set-Content $_.FullName $n -NoNewline; Write-Host "Blanked defaults in $($_.Name)" }
          }
          Remove-Item .drop -Recurse -Force
          # unpack replaces the folder; keep the hand-written README
          git checkout HEAD -- src/solution/README.md

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: solution/unpack-drop
          delete-branch: true
          commit-message: "solution: unpack PPLF export into src/solution"
          title: "solution: unpack PPLF export into src/solution"
          body: |
            Unpacked from `.drop/` by the *Unpack solution drop* workflow.
            Environment variable values were removed. Review the diff, then merge.
          add-paths: |
            src/solution
            .drop
