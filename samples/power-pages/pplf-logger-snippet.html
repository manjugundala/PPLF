<!--
  PPLF - Power Pages snippet
  Paste into a Content Snippet (e.g. "Footer") or a Web Template that every page uses.
  Upload src/pages/pplf-pages-logger.js as a Web File named pplf-pages-logger.js at the site root first.
  Replace FLOW_GUID with the id shown for "PPLF | Ingest | Power Pages" under Set up > Cloud flows.
-->
<script src="/pplf-pages-logger.js"></script>
<script>
  PplfLogger.init({
    sourceName: "{{ website.name | escape }}",
    flowId: "FLOW_GUID",
    minLevel: "Information",
    appVersion: "1.0.0",
    userPrincipalName: "{% if user %}{{ user.emailaddress1 | escape }}{% endif %}"
  });

  // Page view
  PplfLogger.info("{{ page.name | escape }}", "Page viewed");

  // Example: time and log a form submission
  // document.querySelector('#InsertButton')?.addEventListener('click', function () {
  //   PplfLogger.newCorrelation();
  //   PplfLogger.info("{{ page.name | escape }}", "Form submitted");
  // });
</script>
