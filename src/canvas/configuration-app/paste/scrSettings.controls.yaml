# Studio paste file for scrSettings. Select the screen scrSettings in Tree view and press Ctrl+V.
# Then set these screen properties in the formula bar:
#   Fill:
#     =BrandTheme.Background
#   OnVisible:
#     =Refresh('PPLF | Configurations'); Set(gblEditConfig, Blank())
- conSettingsRoot:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      Width: =Parent.Width
      Height: =Parent.Height
      LayoutDirection: =LayoutDirection.Vertical
      DropShadow: =DropShadow.None
    Children:
      - conHdrSettings:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
            Height: =76
            FillPortions: =0
            Fill: =BrandTheme.Primary
            PaddingLeft: =24
            PaddingTop: =12
            LayoutGap: =2
            DropShadow: =DropShadow.None
          Children:
            - lblHdrTitleSettings:
                Control: Text@0.0.51
                Properties:
                  Text: ="Power Platform Logging | Settings"
                  FontColor: =BrandTheme.TextOnPrimary
                  Size: =20
                  Weight: ='TextCanvas.Weight'.Semibold
                  Height: =32
                  Width: =Parent.Width - 48
            - lblHdrSubSettings:
                Control: Text@0.0.51
                Properties:
                  Text: ="Levels, retention and alerts for the environment and for each source."
                  FontColor: =BrandTheme.TextOnPrimary
                  Size: =12
                  Height: =22
                  Width: =Parent.Width - 48
      - recHdrLineSettings:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =BrandTheme.Accent
            Width: =Parent.Width
            Height: =4
      - conSettingsNav:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            Height: =56
            FillPortions: =0
            PaddingLeft: =PplfGap
            PaddingTop: =8
            DropShadow: =DropShadow.None
          Children:
            - btnSettingsBack:
                Control: Button@0.0.45
                Properties:
                  BasePaletteColor: =BrandTheme.Primary
                  Text: ="Overview"
                  Appearance: ='ButtonCanvas.Appearance'.Subtle
                  Icon: ="ArrowLeft"
                  Width: =140
                  OnSelect: =Navigate(scrHome, ScreenTransition.None)
      - conSettingsBody:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =PplfGap
            PaddingRight: =PplfGap
            PaddingBottom: =PplfGap
            LayoutGap: =PplfGap
            DropShadow: =DropShadow.None
          Children:
            # ---------------- Global settings (environment variables) ----------------
            - conGlobal:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  FillPortions: =2
                  Fill: =BrandTheme.Surface
                  BorderColor: =BrandTheme.Border
                  BorderThickness: =1
                  PaddingLeft: =PplfGap
                  PaddingRight: =PplfGap
                  PaddingTop: =PplfGap
                  LayoutGap: =8
                  DropShadow: =DropShadow.None
                Children:
                  - lblGlobalTitle:
                      Control: Text@0.0.51
                      Properties:
                        Text: ="Environment settings"
                        Size: =18
                        Weight: ='TextCanvas.Weight'.Semibold
                        Height: =32
                        Width: =Parent.Width - 2 * PplfGap
                  - lblGlobalHelp:
                      Control: Text@0.0.51
                      Properties:
                        Text: ="Stored as environment variable values in this environment. The log target is changed on the Setup screen."
                        FontColor: =BrandTheme.TextSecondary
                        Wrap: =true
                        Height: =48
                        Width: =Parent.Width - 2 * PplfGap
                  - lblDefLevel:
                      Control: Text@0.0.51
                      Properties:
                        Text: ="Default minimum level"
                        Weight: ='TextCanvas.Weight'.Semibold
                        Height: =24
                        Width: =Parent.Width - 2 * PplfGap
                  - ddDefaultLevel:
                      Control: DropDown@0.0.45
                      Properties:
                        Items: =ForAll(PplfLevels, Name)
                        DefaultSelectedItems: =[PplfEnv("pplf_DefaultMinimumLevel")]
                        Width: =Parent.Width - 2 * PplfGap
                        AccessibleLabel: ="Default minimum level"
                  - lblRetention:
                      Control: Text@0.0.51
                      Properties:
                        Text: ="Default retention (days)"
                        Weight: ='TextCanvas.Weight'.Semibold
                        Height: =24
                        Width: =Parent.Width - 2 * PplfGap
                  - numRetention:
                      Control: NumberInput@2.9.12
                      Properties:
                        Value: =Value(PplfEnv("pplf_DefaultRetentionDays"))
                        Min: =1
                        Max: =3650
                        Width: =Parent.Width - 2 * PplfGap
                        AccessibleLabel: ="Default retention in days"
                  - lblAlertLevel:
                      Control: Text@0.0.51
                      Properties:
                        Text: ="Email alerts from level"
                        Weight: ='TextCanvas.Weight'.Semibold
                        Height: =24
                        Width: =Parent.Width - 2 * PplfGap
                  - ddAlertLevel:
                      Control: DropDown@0.0.45
                      Properties:
                        Items: =["Warning", "Error", "Critical", "None"]
                        DefaultSelectedItems: =[PplfEnv("pplf_AlertMinimumLevel")]
                        Width: =Parent.Width - 2 * PplfGap
                        AccessibleLabel: ="Alert minimum level"
                  - lblRecipients:
                      Control: Text@0.0.51
                      Properties:
                        Text: ="Alert recipients (separate with ;)"
                        Weight: ='TextCanvas.Weight'.Semibold
                        Height: =24
                        Width: =Parent.Width - 2 * PplfGap
                  - txtRecipients:
                      Control: TextInput@0.0.54
                      Properties:
                        Value: =PplfEnv("pplf_AlertRecipients")
                        Placeholder: ="ops@contoso.com; admin@contoso.com"
                        Width: =Parent.Width - 2 * PplfGap
                        AccessibleLabel: ="Alert recipients"
                  - btnSaveGlobal:
                      Control: Button@0.0.45
                      Properties:
                        BasePaletteColor: =BrandTheme.Primary
                        Text: ="Save environment settings"
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        Icon: ="Save"
                        Width: =260
                        OnSelect: |-
                          =PplfSetEnv("pplf_DefaultMinimumLevel", ddDefaultLevel.Selected.Value);
                          PplfSetEnv("pplf_DefaultRetentionDays", Text(numRetention.Value));
                          PplfSetEnv("pplf_AlertMinimumLevel", ddAlertLevel.Selected.Value);
                          PplfSetEnv("pplf_AlertRecipients", Trim(txtRecipients.Value));
                          PplfAdminLog("Information", "scrSettings", "Environment settings changed");
                          Notify("Saved. Flows pick up new values within a few minutes.", NotificationType.Success)
            # ---------------- Per-source settings (PPLF Log Configurations) ----------------
            - conSources:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  FillPortions: =3
                  Fill: =BrandTheme.Surface
                  BorderColor: =BrandTheme.Border
                  BorderThickness: =1
                  PaddingLeft: =PplfGap
                  PaddingRight: =PplfGap
                  PaddingTop: =PplfGap
                  LayoutGap: =8
                  DropShadow: =DropShadow.None
                Children:
                  - lblSourcesTitle:
                      Control: Text@0.0.51
                      Properties:
                        Text: ="Per-source settings (Dataverse)"
                        Size: =18
                        Weight: ='TextCanvas.Weight'.Semibold
                        Height: =32
                        Width: =Parent.Width - 2 * PplfGap
                  - lblSourcesHelp:
                      Control: Text@0.0.51
                      Properties:
                        Text: ="The * row applies to every source without its own row. Source names must match what the app or flow sends. With the SharePoint target, edit the PPLF Log Config list instead."
                        FontColor: =BrandTheme.TextSecondary
                        Wrap: =true
                        Height: =48
                        Width: =Parent.Width - 2 * PplfGap
                  - btnNewSource:
                      Control: Button@0.0.45
                      Properties:
                        BasePaletteColor: =BrandTheme.Primary
                        Text: ="Add source"
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        Icon: ="Add"
                        Width: =160
                        OnSelect: =Set(gblEditConfig, Defaults('PPLF | Configurations')); Set(gblEditIsNew, true)
                  - galSources:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Items: =SortByColumns('PPLF | Configurations', "pplf_name", SortOrder.Ascending)
                        TemplateSize: =56
                        Width: =Parent.Width - 2 * PplfGap
                        FillPortions: =1
                        OnSelect: =Set(gblEditConfig, ThisItem); Set(gblEditIsNew, false)
                      Children:
                        - lblSrcName:
                            Control: Text@0.0.51
                            Properties:
                              Text: =ThisItem.'Source Name'
                              Weight: ='TextCanvas.Weight'.Semibold
                              X: =8
                              Y: =4
                              Width: =Parent.TemplateWidth / 2
                              Height: =24
                        - lblSrcMeta:
                            Control: Text@0.0.51
                            Properties:
                              Text: |-
                                =If(ThisItem.Enabled, "From " & Text(ThisItem.'Minimum Level'), "Off") & If(IsBlank(ThisItem.'Retention (days)'), "", "  ·  keep " & ThisItem.'Retention (days)' & " days")
                              FontColor: =BrandTheme.TextSecondary
                              Size: =12
                              X: =8
                              Y: =28
                              Width: =Parent.TemplateWidth - 16
                              Height: =22
                  - conEditSource:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        Height: =72
                        FillPortions: =0
                        LayoutGap: =8
                        LayoutAlignItems: =LayoutAlignItems.End
                        Visible: =!IsBlank(gblEditConfig)
                        DropShadow: =DropShadow.None
                      Children:
                        - txtSrcName:
                            Control: TextInput@0.0.54
                            Properties:
                              Value: =gblEditConfig.'Source Name'
                              Placeholder: ="Source name or *"
                              Width: =200
                              AccessibleLabel: ="Source name"
                        - ddSrcLevel:
                            Control: DropDown@0.0.45
                            Properties:
                              Items: =ForAll(PplfLevels, Name)
                              DefaultSelectedItems: =[Coalesce(LookUp(PplfLevels, Severity = gblEditConfig.'Minimum Severity').Name, "Information")]
                              Width: =160
                              AccessibleLabel: ="Minimum level"
                        - numSrcRetention:
                            Control: NumberInput@2.9.12
                            Properties:
                              Value: =gblEditConfig.'Retention (days)'
                              Min: =1
                              Width: =100
                              AccessibleLabel: ="Retention days"
                        - tglSrcEnabled:
                            Control: Toggle@1.1.5
                            Properties:
                              Checked: =Coalesce(gblEditConfig.Enabled, true)
                              Label: ="On"
                              Width: =90
                        - btnSaveSource:
                            Control: Button@0.0.45
                            Properties:
                              BasePaletteColor: =BrandTheme.Primary
                              Text: ="Save"
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              Width: =90
                              DisplayMode: =If(IsBlank(Trim(txtSrcName.Value)), DisplayMode.Disabled, DisplayMode.Edit)
                              OnSelect: |-
                                =Patch('PPLF | Configurations', If(gblEditIsNew, Defaults('PPLF | Configurations'), gblEditConfig), {
                                    'Source Name': Trim(txtSrcName.Value),
                                    'Minimum Level': Switch(LookUp(PplfLevels, Name = ddSrcLevel.Selected.Value).Severity,
                                        0, 'PPLF | Log Level'.Trace, 1, 'PPLF | Log Level'.Debug, 3, 'PPLF | Log Level'.Warning,
                                        4, 'PPLF | Log Level'.Error, 5, 'PPLF | Log Level'.Critical, 'PPLF | Log Level'.Information),
                                    'Minimum Severity': LookUp(PplfLevels, Name = ddSrcLevel.Selected.Value).Severity,
                                    'Retention (days)': If(IsBlank(numSrcRetention.Value), Blank(), numSrcRetention.Value),
                                    Enabled: tglSrcEnabled.Checked
                                });
                                PplfAdminLog("Information", "scrSettings", "Source settings saved for " & Trim(txtSrcName.Value));
                                Set(gblEditConfig, Blank());
                                Notify("Saved", NotificationType.Success)
                        - btnDeleteSource:
                            Control: Button@0.0.45
                            Properties:
                              BasePaletteColor: =BrandTheme.Primary
                              Text: ="Delete"
                              Appearance: ='ButtonCanvas.Appearance'.Subtle
                              Width: =90
                              Visible: =!gblEditIsNew && gblEditConfig.'Source Name' <> "*"
                              OnSelect: =Remove('PPLF | Configurations', gblEditConfig); Set(gblEditConfig, Blank())
